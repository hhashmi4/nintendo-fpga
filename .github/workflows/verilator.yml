name: FPGA Verification

on:
  push:
  pull_request:
    branches: [main]

jobs:
  verification:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python verification dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Verilator 5.032
        env:
          # Immutable source commit for the upstream v5.032 release.
          VERILATOR_REVISION: 8ff77e9d47351b0a59114929880687839a51840b
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf bison flex help2man libfl-dev zlib1g-dev perl git
          git init "$RUNNER_TEMP/verilator-src"
          cd "$RUNNER_TEMP/verilator-src"
          git remote add origin https://github.com/verilator/verilator.git
          git fetch --depth 1 origin "$VERILATOR_REVISION"
          git checkout --detach FETCH_HEAD
          autoconf
          ./configure --prefix="$RUNNER_TEMP/verilator-5.032"
          make -j2
          make install
          echo "$RUNNER_TEMP/verilator-5.032/bin" >> "$GITHUB_PATH"

      - name: Show Verilator version
        run: |
          version="$(verilator --version)"
          echo "$version"
          [[ "$version" == "Verilator 5.032 "* ]]

      - name: Run Python, lint, and Phase 1-3K RTL simulation tests
        run: scripts/test.sh
